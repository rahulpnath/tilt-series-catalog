name: shop-catalog

services:
  catalog-api:
    build:
      context: .
      dockerfile: catalog-api.dev.Dockerfile
    environment:
      ConnectionStrings__Db: "Server=sqlserver,1433;Database=ShopCatalog;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Rabbit__Url: "amqp://shop:shop@rabbitmq"
    volumes:
      - ./src:/src
    networks:
      default:
      shopnet:
        aliases:
          - catalog-api

  catalog-worker:
    build:
      context: .
      dockerfile: catalog-worker.dev.Dockerfile
    environment:
      Rabbit__Url: "amqp://shop:shop@rabbitmq"
    volumes:
      - ./src:/src

# Caddy's network; it reaches the API by its alias.
networks:
  shopnet:
    external: true
