name: shop-catalog

services:
  api:
    build:
      context: .
      dockerfile: catalog-api.dev.Dockerfile
    ports:
      - "5101:5101"
    environment:
      ConnectionStrings__Db: "Server=sqlserver,1433;Database=ShopCatalog;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Rabbit__Url: "amqp://shop:shop@rabbitmq"
    volumes:
      - ./src:/src
    networks:
      default:
      shopnet:
        aliases:
          - catalog-api

  worker:
    build:
      context: .
      dockerfile: catalog-worker.dev.Dockerfile
    environment:
      Rabbit__Url: "amqp://shop:shop@rabbitmq"
    volumes:
      - ./src:/src
    networks:
      - default
      - shopnet

# Owned by the workspace's infra project; SQL Server and RabbitMQ live there.
networks:
  shopnet:
    external: true
